name: Sync Release Artifacts to JFrog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to sync (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  sync:
    uses: linuxonzapps/.github/.github/workflows/sync-jfrog-release.yml@main
    secrets: inherit
    with:
      tag_name: ${{ inputs.tag_name }}
